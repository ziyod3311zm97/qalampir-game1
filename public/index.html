<script>
    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();

    const socket = io();

    // =====================================================
    // TELEGRAM USER
    // =====================================================

    const user =
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
            ? tg.initDataUnsafe.user
            : {
                id: "demo",
                first_name: "O'yinchi",
                username: null
            };

    // =====================================================
    // STATE
    // =====================================================

    let coins = 100;
    let streak = 0;

    let mySpot = -1;
    let currentRoom = null;
    let isMyTurn = false;
    let gamePhase = "WAITING";

    // =====================================================
    // ELEMENTS
    // =====================================================

    const homeScreen =
        document.getElementById("homeScreen");

    const gameScreen =
        document.getElementById("gameScreen");

    const statusEl =
        document.getElementById("status");

    const readyBtn =
        document.getElementById("readyBtn");

    const myCells =
        document.querySelectorAll(".my-cell");

    const enemyCells =
        document.querySelectorAll(".enemy-cell");

    // =====================================================
    // USER DATA
    // =====================================================

    async function loadUser() {
        try {
            const response = await fetch("/api/user", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(user)
            });

            const data = await response.json();

            if (!data.success) {
                throw new Error(
                    data.message ||
                    "User yuklanmadi"
                );
            }

            coins =
                Number(data.user.coins || 0);

            streak =
                Number(data.user.streak || 0);

            document.getElementById(
                "playerName"
            ).innerText =
                data.user.first_name ||
                user.first_name ||
                "O'yinchi";

            updateCoinsDisplay();
            updateStreakDisplay();

        } catch (error) {

            console.error(
                "User yuklash xatosi:",
                error
            );

            // Telegram ichida bo'lmagan oddiy browser test
            document.getElementById(
                "playerName"
            ).innerText =
                user.first_name ||
                "O'yinchi";

            updateCoinsDisplay();
            updateStreakDisplay();
        }
    }

    // =====================================================
    // COIN
    // =====================================================

    function updateCoinsDisplay() {
        document.getElementById(
            "coinBalance"
        ).innerText =
            Number(coins).toLocaleString();
    }

    function updateStreakDisplay() {
        document.getElementById(
            "streak"
        ).innerText =
            Number(streak);
    }

    // =====================================================
    // TELEGRAM USER LOAD
    // =====================================================

    loadUser();

    // =====================================================
    // HOME / GAME
    // =====================================================

    function openGame() {
        homeScreen.style.display =
            "none";

        gameScreen.style.display =
            "block";
    }

    function backHome() {
        try {
            socket.disconnect();
        } catch (e) {}

        location.reload();
    }

    // =====================================================
    // RANDOM GAME
    // =====================================================

    function startRandom() {

        openGame();

        gamePhase =
            "WAITING";

        statusEl.innerText =
            "⚡ Raqib qidirilmoqda...";

        socket.emit(
            "joinRandomGame",
            user
        );
    }

    // =====================================================
    // PRIVATE ROOM
    // =====================================================

    function openRoomModal() {
        document.getElementById(
            "roomModal"
        ).style.display = "flex";
    }

    function closeRoomModal() {
        document.getElementById(
            "roomModal"
        ).style.display = "none";
    }

    function createRoom() {

        closeRoomModal();

        openGame();

        statusEl.innerText =
            "🌶️ Xona yaratilmoqda...";

        socket.emit(
            "createPrivateRoom",
            user
        );
    }

    function joinRoom() {

        const code =
            document
                .getElementById("roomInput")
                .value
                .trim();

        if (
            !code ||
            code.length !== 4
        ) {
            tg.showAlert(
                "4 xonali kod kiriting!"
            );

            return;
        }

        closeRoomModal();

        openGame();

        statusEl.innerText =
            "🚪 Xonaga ulanilmoqda...";

        socket.emit(
            "joinPrivateRoom",
            {
                roomCode: code,
                userData: user
            }
        );
    }

    // =====================================================
    // ROOM CREATED
    // =====================================================

    socket.on(
        "roomCreated",
        data => {

            currentRoom =
                data.roomId;

            statusEl.innerText =
                `🔥 Xona yaratildi!\n\n` +
                `Kod: ${data.roomCode}\n\n` +
                `Do'stingizga kodni yuboring.`;

            shareRoom(
                data.roomCode
            );
        }
    );

    // =====================================================
    // WAITING
    // =====================================================

    socket.on(
        "waitingForOpponent",
        () => {

            statusEl.innerText =
                "⏳ Raqib kutilmoqda...\n\n" +
                "6 soniyada odam topilmasa Bot ulanadi.";
        }
    );

    // =====================================================
    // MATCHED
    // =====================================================

    socket.on(
        "gameMatched",
        data => {

            currentRoom =
                data.roomId;

            gamePhase =
                "PLACE";

            statusEl.innerText =
                `⚔️ Raqib: ${data.opponent.first_name}\n\n` +
                `🌶️ Qalampiringizni yashiring.`;

            mySpot = -1;

            myCells.forEach(
                cell => {
                    cell.innerHTML = "";
                    cell.classList.remove(
                        "selected"
                    );
                }
            );

            readyBtn.style.display =
                "none";
        }
    );

    // =====================================================
    // ERROR
    // =====================================================

    socket.on(
        "errorMsg",
        msg => {

            tg.showAlert(
                msg
            );

            location.reload();
        }
    );

    // =====================================================
    // SELECT PEPPER
    // =====================================================

    function selectMySpot(index) {

        if (
            gamePhase !== "PLACE"
        ) {
            return;
        }

        myCells.forEach(
            cell => {

                cell.innerHTML =
                    "";

                cell.classList.remove(
                    "selected"
                );
            }
        );

        mySpot =
            index;

        myCells[index].innerHTML =
            "🌶️";

        myCells[index]
            .classList
            .add("selected");

        readyBtn.style.display =
            "block";
    }

    // =====================================================
    // CONFIRM PEPPER
    // =====================================================

    function confirmSpot() {

        if (
            mySpot === -1
        ) {
            return;
        }

        readyBtn.style.display =
            "none";

        statusEl.innerText =
            "⏳ Raqib tayyor bo'lishi kutilmoqda...";

        socket.emit(
            "setSpot",
            {
                roomId:
                    currentRoom,

                spot:
                    mySpot
            }
        );
    }

    // =====================================================
    // BATTLE START
    // =====================================================

    socket.on(
        "battleStart",
        data => {

            gamePhase =
                "BATTLE";

            isMyTurn =
                data.turn ===
                socket.id;

            statusEl.innerText =
                isMyTurn
                    ? "🔥 SIZNING NAVBATINGIZ!"
                    : "⏳ Raqib navbati...";
        }
    );

    // =====================================================
    // ATTACK
    // =====================================================

    function attack(index) {

        if (
            gamePhase !==
                "BATTLE"
        ) {
            return;
        }

        if (!isMyTurn) {
            return;
        }

        if (
            enemyCells[index]
                .innerHTML !== ""
        ) {
            return;
        }

        socket.emit(
            "attackSpot",
            {
                roomId:
                    currentRoom,

                spot:
                    index
            }
        );
    }

    // =====================================================
    // TURN CHANGED
    // =====================================================

    socket.on(
        "turnChanged",
        data => {

            if (
                data.attacker ===
                socket.id
            ) {

                enemyCells[
                    data.spot
                ].innerHTML =
                    "❌";

                enemyCells[
                    data.spot
                ].classList.add(
                    "miss"
                );

            } else {

                myCells[
                    data.spot
                ].innerHTML =
                    "❌";

                myCells[
                    data.spot
                ].classList.add(
                    "miss"
                );
            }

            isMyTurn =
                data.nextTurn ===
                socket.id;

            statusEl.innerText =
                isMyTurn
                    ? "🔥 SIZNING NAVBATINGIZ!"
                    : "⏳ Raqib navbati...";
        }
    );

    // =====================================================
    // GAME OVER
    // =====================================================

    socket.on(
        "gameOver",
        data => {

            gamePhase =
                "END";

            const won =
                data.winner ===
                socket.id;

            if (won) {

                // Server database'da coin beradi.
                // Frontendda yana +100 qilmaymiz.

                statusEl.innerText =
                    "🏆 SIZ YUTDINGIZ!\n\n" +
                    "+20 🌶️";

                if (
                    data.hitSpot !==
                    undefined
                ) {

                    enemyCells[
                        data.hitSpot
                    ].innerHTML =
                        "🌶️";
                }

                tg.HapticFeedback
                    ?.notificationOccurred(
                        "success"
                    );

                // Serverdagi yangi balansni
                // qayta olish
                setTimeout(
                    loadUser,
                    500
                );

            } else {

                statusEl.innerText =
                    "❌ YUTQAZDINGIZ!\n\n" +
                    "Coin o'zgarmadi.";

                if (
                    data.hitSpot !==
                    undefined
                ) {

                    myCells[
                        data.hitSpot
                    ].innerHTML =
                        "🌶️";
                }

                tg.HapticFeedback
                    ?.notificationOccurred(
                        "error"
                    );

                setTimeout(
                    loadUser,
                    500
                );
            }

            setTimeout(
                showResultActions,
                1500
            );
        }
    );

    // =====================================================
    // RESULT
    // =====================================================

    function showResultActions() {

        const again =
            confirm(
                "🔥 Yana bir marta o'ynaysizmi?"
            );

        if (again) {

            location.reload();

        } else {

            backHome();
        }
    }

    // =====================================================
    // REFERRAL
    // =====================================================

    function shareGame() {

        const botUsername =
            "YOUR_BOT_USERNAME";

        if (
            botUsername ===
            "YOUR_BOT_USERNAME"
        ) {

            tg.showAlert(
                "Bot username hali sozlanmagan."
            );

            return;
        }

        const referralCode =
            user.id;

        const link =
            `https://t.me/${botUsername}` +
            `?start=ref_${referralCode}`;

        const text =
            "🌶️ Qalampirga qo'shil!\n\n" +
            "Meni yuta olasanmi? 😈\n\n" +
            "👇 Duelga kir";

        const url =
            "https://t.me/share/url" +
            "?url=" +
            encodeURIComponent(link) +
            "&text=" +
            encodeURIComponent(text);

        tg.openTelegramLink(
            url
        );
    }

    // =====================================================
    // SHARE ROOM
    // =====================================================

    function shareRoom(
        roomCode
    ) {

        const botUsername =
            "YOUR_BOT_USERNAME";

        if (
            botUsername ===
            "YOUR_BOT_USERNAME"
        ) {
            return;
        }

        const link =
            `https://t.me/${botUsername}` +
            `?start=room_${roomCode}`;

        const text =
            "🌶️ Seni Qalampir dueliga chaqiraman!\n\n" +
            "🔥 Meni yuta olasanmi?\n\n" +
            "👇 Duelga kir";

        const url =
            "https://t.me/share/url" +
            "?url=" +
            encodeURIComponent(link) +
            "&text=" +
            encodeURIComponent(text);

        setTimeout(
            () => {
                tg.openTelegramLink(
                    url
                );
            },
            700
        );
    }

    // =====================================================
    // DAILY BONUS
    // =====================================================

    function dailyBonus() {

        const lastBonus =
            localStorage.getItem(
                "qalampir_daily_bonus"
            );

        const today =
            new Date()
                .toISOString()
                .slice(0, 10);

        if (
            lastBonus ===
            today
        ) {

            tg.showAlert(
                "🎁 Bugungi bonusni allaqachon oldingiz!"
            );

            return;
        }

        localStorage.setItem(
            "qalampir_daily_bonus",
            today
        );

        tg.showAlert(
            "🎁 Daily bonus tizimi tez orada serverga ulanadi."
        );
    }

    // =====================================================
    // LEADERBOARD
    // =====================================================

    async function showLeaderboard() {

        const modal =
            document.getElementById(
                "leaderboardModal"
            );

        modal.style.display =
            "flex";

        const box =
            modal.querySelector(
                ".modal-box"
            );

        box.innerHTML = `
            <div class="modal-title">
                🏆 TOP O'YINCHILAR
            </div>

            <div id="leaderboardList">
                ⏳ Yuklanmoqda...
            </div>

            <button
                class="modal-btn modal-cancel"
                onclick="closeLeaderboard()"
            >
                Yopish
            </button>
        `;

        try {

            const response =
                await fetch(
                    "/api/leaderboard?limit=10"
                );

            const data =
                await response.json();

            if (
                !data.success
            ) {
                throw new Error(
                    "Leaderboard xatosi"
                );
            }

            const list =
                document.getElementById(
                    "leaderboardList"
                );

            if (
                !data.leaderboard ||
                data.leaderboard.length === 0
            ) {

                list.innerHTML =
                    `
                    <div style="
                        text-align:center;
                        padding:20px;
                        color:#8b96a8;
                    ">
                        Hali o'yinchilar yo'q.
                    </div>
                    `;

                return;
            }

            list.innerHTML =
                data.leaderboard
                    .map(
                        (player, index) => {

                            const medals = [
                                "🥇",
                                "🥈",
                                "🥉"
                            ];

                            const rank =
                                medals[index] ||
                                String(
                                    index + 1
                                );

                            const name =
                                player.first_name ||
                                player.username ||
                                "Player";

                            const score =
                                Number(
                                    player.coins || 0
                                ).toLocaleString();

                            return `
                                <div class="rank-row">
                                    <div class="rank-number">
                                        ${rank}
                                    </div>

                                    <div class="rank-avatar">
                                        🌶️
                                    </div>

                                    <div class="rank-name">
                                        ${escapeHtml(name)}
                                    </div>

                                    <div class="rank-score">
                                        ${score} 🌶️
                                    </div>
                                </div>
                            `;
                        }
                    )
                    .join("");

        } catch (error) {

            console.error(
                "Leaderboard error:",
                error
            );

            document.getElementById(
                "leaderboardList"
            ).innerHTML =
                `
                <div style="
                    text-align:center;
                    padding:20px;
                    color:#ff4d5e;
                ">
                    Leaderboardni yuklab bo'lmadi.
                </div>
                `;
        }
    }

    // =====================================================
    // HTML SECURITY
    // =====================================================

    function escapeHtml(
        value
    ) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );
    }

    // =====================================================
    // CLOSE LEADERBOARD
    // =====================================================

    function closeLeaderboard() {

        document.getElementById(
            "leaderboardModal"
        ).style.display =
            "none";
    }

    // =====================================================
    // SKINS
    // =====================================================

    function showSkins() {

        tg.showAlert(
            "🎨 Skinlar tez orada ochiladi!\n\n" +
            "🔥 Fire Pepper\n" +
            "💎 Diamond Pepper\n" +
            "👑 King Pepper"
        );
    }

    // =====================================================
    // TELEGRAM MAIN BUTTON
    // =====================================================

    try {

        tg.MainButton
            .setText(
                "⚡ O'YINNI BOSHLASH"
            )
            .show()
            .onClick(
                () => {
                    startRandom();
                }
            );

    } catch (e) {
        console.log(
            "Telegram MainButton mavjud emas."
        );
    }

</script>

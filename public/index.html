<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Qalampir Top - Online</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            user-select: none;
        }
        
        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 260px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background-color: #2c3e50;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .tab-btn.active { background-color: #3498db; }

        .dashboard {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 12px;
            width: 100%;
            max-width: 240px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 15px;
        }
        .dash-item { font-size: 15px; margin: 6px 0; color: #FFD700; }

        h2 { margin: 5px 0; font-size: 22px; color: #ffffff; }
        .status { font-size: 14px; color: #aaa; margin-bottom: 15px; height: 20px; text-align: center; }
        .label { font-size: 12px; color: #888; margin: 6px 0; text-transform: uppercase; letter-spacing: 1px; }
        .grid-container { display: grid; grid-template-columns: repeat(3, 65px); gap: 10px; }
        .cell { width: 65px; height: 65px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; transition: 0.2s; box-shadow: 0 3px 6px rgba(0,0,0,0.4); }
        .my-cell { background-color: #3498db; border: 2px solid #2980b9; }
        .enemy-cell { background-color: #2c3e50; border: 2px solid #34495e; }
        .cell.selected { border-color: #ffffff; box-shadow: 0 0 15px #3498db; }
        .cell:active { transform: scale(0.92); }
        .miss { color: #e74c3c; font-weight: bold; font-size: 30px; }
        hr { width: 80%; border: 0; border-top: 1px solid #333; margin: 15px 0; }
        .start-btn { background-color: #2ecc71; color: white; border: none; padding: 10px 25px; font-size: 16px; border-radius: 20px; margin-top: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('game')">🎮 O'yin</button>
        <button class="tab-btn" onclick="switchTab('dash')">📊 Profil</button>
    </div>

    <!-- Dashboard Bo'limi -->
    <div id="dashSection" class="dashboard" style="display: none;">
        <h3>Sizning Statisikangiz</h3>
        <div class="dash-item">Balans: <span id="dashStars">0</span> ⭐️</div>
        <div class="dash-item" style="color:#2ecc71;">G'alabalar: <span id="dashWins">0</span></div>
        <div class="dash-item" style="color:#e74c3c;">Mag'lubiyatlar: <span id="dashLosses">0</span></div>
    </div>

    <!-- O'yin Bo'limi -->
    <div id="gameSection" style="display: flex; flex-direction: column; align-items: center;">
        <h2>🌶️ Qalampir Top (PvP)</h2>
        <div id="status" class="status">O'z qalampiringizni yashiring!</div>

        <div class="label">Raqib maydoni</div>
        <div class="grid-container" id="enemyGrid">
            <div class="cell enemy-cell" onclick="attack(0)"></div>
            <div class="cell enemy-cell" onclick="attack(1)"></div>
            <div class="cell enemy-cell" onclick="attack(2)"></div>
            <div class="cell enemy-cell" onclick="attack(3)"></div>
            <div class="cell enemy-cell" onclick="attack(4)"></div>
            <div class="cell enemy-cell" onclick="attack(5)"></div>
        </div>

        <hr>

        <div class="label">Sizning maydoningiz</div>
        <div class="grid-container" id="myGrid">
            <div class="cell my-cell" onclick="selectMyPepperSpot(0)"></div>
            <div class="cell my-cell" onclick="selectMyPepperSpot(1)"></div>
            <div class="cell my-cell" onclick="selectMyPepperSpot(2)"></div>
            <div class="cell my-cell" onclick="selectMyPepperSpot(3)"></div>
            <div class="cell my-cell" onclick="selectMyPepperSpot(4)"></div>
            <div class="cell my-cell" onclick="selectMyPepperSpot(5)"></div>
        </div>

        <button id="startBtn" class="start-btn" onclick="searchOpponent()">Raqib Izlash (10 ⭐️)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const socket = io();
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || Math.floor(Math.random() * 1000000);

        let myPepperPos = -1;
        let currentRoomId = null;
        let isMyTurn = false;

        const myCells = document.querySelectorAll('.my-cell');
        const enemyCells = document.querySelectorAll('.enemy-cell');
        const statusEl = document.getElementById('status');
        const startBtn = document.getElementById('startBtn');

        // Baza ma'lumotlarini yuklash
        function loadUserData() {
            fetch(`/api/user/${userId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('dashStars').innerText = data.stars;
                    document.getElementById('dashWins').innerText = data.wins;
                    document.getElementById('dashLosses').innerText = data.losses;
                });
        }
        loadUserData();

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            if (tab === 'game') {
                document.getElementById('gameSection').style.display = 'flex';
                document.getElementById('dashSection').style.display = 'none';
                event.target.classList.add('active');
            } else {
                document.getElementById('gameSection').style.display = 'none';
                document.getElementById('dashSection').style.display = 'block';
                event.target.classList.add('active');
                loadUserData();
            }
        }

        function selectMyPepperSpot(index) {
            if (currentRoomId) return;
            myCells.forEach(c => { c.innerHTML = ""; c.classList.remove('selected'); });
            myPepperPos = index;
            myCells[index].innerHTML = "🌶️";
            myCells[index].classList.add('selected');
            statusEl.innerText = "Tayyor! Raqib izlashni bosing.";
            startBtn.style.display = "block";
        }

        function searchOpponent() {
            if (myPepperPos === -1) return;
            startBtn.style.display = "none";
            statusEl.innerText = "Raqib izlanmoqda...";
            socket.emit('join_game', { userId, pepperPos: myPepperPos });
        }

        // Socket Eventlar
        socket.on('waiting', (msg) => { statusEl.innerText = msg; });

        socket.on('game_start', ({ roomId, turn }) => {
            currentRoomId = roomId;
            isMyTurn = (turn === socket.id);
            statusEl.innerText = isMyTurn ? "Raqib topildi! Sizning navbatingiz." : "Raqib topildi! Raqib navbati.";
        });

        function attack(index) {
            if (!currentRoomId || !isMyTurn || enemyCells[index].innerHTML !== "") return;
            socket.emit('make_move', { roomId: currentRoomId, cellIndex: index });
        }

        socket.on('move_result', ({ attacker, cellIndex, hit, nextTurn }) => {
            if (attacker == userId) {
                enemyCells[cellIndex].innerHTML = "X";
                enemyCells[cellIndex].classList.add('miss');
            } else {
                myCells[cellIndex].innerHTML = "X";
                myCells[cellIndex].classList.add('miss');
            }
            isMyTurn = (nextTurn === socket.id);
            statusEl.innerText = isMyTurn ? "Sizning navbatingiz!" : "Raqib navbati...";
        });

        socket.on('game_over', ({ winner, loser, hitIndex }) => {
            if (winner == userId) {
                statusEl.innerText = "🎉 TABRIKLAYMIZ! G'alaba qozondingiz (+10 ⭐️)";
                tg.HapticFeedback.notificationOccurred('success');
            } else {
                statusEl.innerText = "❌ YUTQAZDINGIZ! Raqib qalampirni topdi.";
                tg.HapticFeedback.notificationOccurred('error');
            }
            setTimeout(() => location.reload(), 2500);
        });
    </script>
</body>
</html>

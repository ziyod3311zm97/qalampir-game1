<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Qalampir - Telegram Game</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #ff4500;
      --text: #ffffff;
      --subtext: #aaaaaa;
    }
    body {
      margin: 0; padding: 12px;
      background-color: var(--bg-color);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      background: var(--card-bg); padding: 12px 16px; border-radius: 12px; margin-bottom: 12px;
    }
    .stat-item { font-size: 14px; font-weight: bold; }
    .grid-menu {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .btn {
      background: var(--card-bg); border: 1px solid #333; color: var(--text);
      padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-main { background: var(--accent); grid-column: span 2; font-size: 18px; }
    .card {
      background: var(--card-bg); padding: 14px; border-radius: 12px; margin-bottom: 12px;
    }
    .card-title { font-size: 14px; color: var(--subtext); margin-bottom: 8px; }
    .skin-item, .rank-item {
      display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #2a2a2a;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <!-- TOP STATS -->
  <div class="header">
    <div class="stat-item">🌶️ <span id="coins">12,450</span></div>
    <div class="stat-item">🔥 <span id="streak">7</span> Win</div>
    <div class="stat-item">⚡ <span id="energy">5/5</span></div>
  </div>

  <!-- MAIN MENU -->
  <div id="main-menu">
    <div class="grid-menu">
      <button class="btn btn-main" onclick="startGame('pro')">⚡ O‘YINNI BOSHLASH</button>
      <button class="btn" onclick="inviteFriend()">👥 DO‘STLAR BILAN</button>
      <button class="btn" onclick="showTab('leaderboard')">🏆 REYTING</button>
      <button class="btn" onclick="claimDaily()">🎁 BONUS</button>
      <button class="btn" onclick="showTab('skins')">🌶️ SKINLAR</button>
    </div>

    <!-- CHALLENGES & NOTIFICATIONS -->
    <div class="card">
      <div class="card-title">KUNLIK VAZIFA</div>
      <div>🎯 3 ta o‘yin yut — <b>+500 Coin</b></div>
    </div>

    <div class="card" id="duel-alert" style="border: 1px solid var(--accent);">
      <div>🔥 <b>Aziz</b> sizni duelga chaqirdi!</div>
      <button class="btn" style="margin-top: 8px; width: 100%;" onclick="acceptDuel('Aziz')">⚔️ QABUL QILISH</button>
    </div>
  </div>

  <!-- SKINS TAB -->
  <div id="skins-tab" class="card hidden">
    <div class="card-title">SKINLAR DO‘KONI</div>
    <div class="skin-item"><span>🌶️ Oddiy Qalampir</span> <b>BEPUL</b></div>
    <div class="skin-item"><span>🔥 Olovli Qalampir</span> <b>1,000 Coin</b></div>
    <div class="skin-item"><span>💎 Diamond Qalampir</span> <b>5,000 Coin</b></div>
    <button class="btn" style="margin-top: 10px; width:100%;" onclick="showTab('main')">⬅️ ORQAGA</button>
  </div>

  <!-- LEADERBOARD TAB -->
  <div id="leaderboard-tab" class="card hidden">
    <div class="card-title">TOP O‘YINCHILAR</div>
    <div class="rank-item"><span>1. Ali</span> <b>12,540</b></div>
    <div class="rank-item"><span>2. Bekzod</span> <b>11,920</b></div>
    <div class="rank-item"><span>3. Sardor</span> <b>9,870</b></div>
    <button class="btn" style="margin-top: 10px; width:100%;" onclick="showTab('main')">⬅️ ORQAGA</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function showTab(tabName) {
      document.getElementById('main-menu').classList.add('hidden');
      document.getElementById('skins-tab').classList.add('hidden');
      document.getElementById('leaderboard-tab').classList.add('hidden');

      if(tabName === 'main') document.getElementById('main-menu').classList.remove('hidden');
      if(tabName === 'skins') document.getElementById('skins-tab').classList.remove('hidden');
      if(tabName === 'leaderboard') document.getElementById('leaderboard-tab').classList.remove('hidden');
    }

    function inviteFriend() {
      const user = tg.initDataUnsafe?.user;
      const refLink = `https://t.me/QalampirBot?start=ref_${user?.id || '123456'}`;
      const text = "🔥 MENI YUTA OLASANMI?\n\nMen Qalampir Topishda seni duelga chaqiryapman! Meni yutsang — 1,000 Coin olasan 😈";
      
      tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(refLink)}&text=${encodeURIComponent(text)}`);
    }

    function startGame(mode) {
      tg.showAlert("O'yin boshlanmoqda! Mode: " + mode);
    }

    function acceptDuel(opponent) {
      tg.showAlert(opponent + " bilan duel boshlandi!");
    }

    function claimDaily() {
      tg.showAlert("Kunlik bonus olindi: +100 Coin!");
    }
  </script>
</body>
</html>

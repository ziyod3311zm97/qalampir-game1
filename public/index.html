<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Qalampir Top</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Original Game Card Dizayni */
        .game-card {
            background-color: #2c2c2e;
            border-radius: 20px;
            padding: 28px 24px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.desc {
            color: #a1a1a6;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: center;
        }

        .score-board {
            background-color: #1c1c1e;
            width: 100%;
            padding: 10px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 15px;
            font-weight: 600;
        }

        .score-value {
            color: #34c759;
            font-size: 18px;
        }

        /* 3x3 Kataklar To'ri */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .chili-box {
            aspect-ratio: 1;
            background-color: #3a3a3c;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            cursor: pointer;
            transition: transform 0.15s ease, background-color 0.2s ease;
            border: 2px solid transparent;
        }

        .chili-box:active {
            transform: scale(0.92);
        }

        .chili-box.correct {
            background-color: rgba(52, 199, 89, 0.2);
            border-color: #34c759;
        }

        .chili-box.incorrect {
            background-color: rgba(255, 59, 48, 0.2);
            border-color: #ff3b30;
        }

        .chili-box .icon {
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .chili-box.revealed .icon {
            opacity: 1;
            transform: scale(1);
        }

        /* Tugmalar */
        .btn {
            background-color: #34c759;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease, transform 0.1s ease;
            outline: none;
        }

        .btn:active {
            transform: scale(0.97);
            background-color: #2fb350;
        }

        .btn-secondary {
            background-color: #3a3a3c;
            margin-top: 10px;
        }

        .btn-secondary:active {
            background-color: #48484a;
        }

        .status-msg {
            font-size: 14px;
            font-weight: 500;
            min-height: 20px;
            margin-bottom: 15px;
            color: #a1a1a6;
        }

        .status-msg.win { color: #34c759; }
        .status-msg.lose { color: #ff3b30; }

        /* Ekranlarni almashtirish */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="game-card">
        
        <!-- Boshlang'ich Ekran -->
        <div id="start-screen" style="width: 100%;">
            <h1>🌶️ Qalampir Top</h1>
            <p class="desc">O'yinga xush kelibsiz! Qutichalar ostiga yashiringan qalampirni toping va ochkolarni to'plang.</p>
            <button class="btn" onclick="startGame()">Boshlash</button>
        </div>

        <!-- Asosiy O'yin Ekrani -->
        <div id="game-screen" class="hidden" style="width: 100%;">
            <h1>🌶️ Qalampir Top</h1>
            
            <div class="score-board">
                <span>Balans:</span>
                <span class="score-value" id="score-text">0 Stars</span>
            </div>

            <div class="status-msg" id="status-text">Qutichalardan birini tanlang!</div>

            <div class="grid-container">
                <div class="chili-box" onclick="makeMove(0)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(1)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(2)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(3)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(4)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(5)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(6)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(7)"><span class="icon">🌶️</span></div>
                <div class="chili-box" onclick="makeMove(8)"><span class="icon">🌶️</span></div>
            </div>

            <button class="btn btn-secondary" onclick="resetGame()">Qayta boshlash</button>
        </div>

    </div>

    <script>
        // Telegram WebApp obyektini yuklash
        const tg = window.Telegram.WebApp;
        tg.expand();

        let score = 0;
        let targetIndex = -1;
        let canPlay = true;

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            initRound();
        }

        function initRound() {
            canPlay = true;
            targetIndex = Math.floor(Math.random() * 9);
            
            const statusText = document.getElementById('status-text');
            statusText.innerText = "Qalampir qaysi qutida?";
            statusText.className = "status-msg";

            const boxes = document.querySelectorAll('.chili-box');
            boxes.forEach(box => {
                box.className = 'chili-box';
            });
        }

        function makeMove(index) {
            if (!canPlay) return;
            canPlay = false;

            const boxes = document.querySelectorAll('.chili-box');
            const statusText = document.getElementById('status-text');
            const scoreText = document.getElementById('score-text');

            // Haptik tebranish effektini chaqirish (Telegram)
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            // To'g'ri qalampir joylashgan qutini doim ochish
            boxes[targetIndex].classList.add('revealed');

            if (index === targetIndex) {
                // G'alaba
                boxes[index].classList.add('correct');
                score += 1;
                scoreText.innerText = score + " Stars";
                statusText.innerText = "🎉 Barrett! To'g'ri topdingiz!";
                statusText.className = "status-msg win";

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
            } else {
                // Mag'lubiyat
                boxes[index].classList.add('incorrect', 'revealed');
                statusText.innerText = "❌ Noto'g'ri! Keyingi safar omad keladi.";
                statusText.className = "status-msg lose";

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
            }

            // 1.5 soniyadan so'ng yangi raundni boshlash
            setTimeout(initRound, 1500);
        }

        function resetGame() {
            score = 0;
            document.getElementById('score-text').innerText = "0 Stars";
            initRound();
        }
    </script>
</body>
</html>

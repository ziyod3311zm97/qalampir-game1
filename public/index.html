<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pepper Battle - Mini App</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 10px;
            box-sizing: border-box;
        }

        /* MINING & CONVERSION WIDGET STYLES */
        .mining-card {
            background: linear-gradient(135deg, #1e1e2f, #2a2a40);
            border-radius: 16px;
            padding: 16px;
            color: white;
            margin: 12px 0;
            text-align: center;
            border: 1px solid #ff4500;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.2);
        }

        .mining-title {
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .mining-speed {
            font-size: 11px;
            color: #00ff88;
            margin-top: 4px;
            font-weight: bold;
        }

        .mining-amount {
            margin: 12px 0;
        }

        .mining-value {
            font-size: 32px;
            font-weight: bold;
            color: #ffab00;
        }

        .mining-currency {
            font-size: 16px;
            color: #ffab00;
            font-weight: bold;
        }

        .btn-claim {
            background: linear-gradient(90deg, #ff4500, #ff7300);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            width: 85%;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .btn-claim:active {
            transform: scale(0.98);
        }

        .conversion-box {
            margin-top: 14px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            font-size: 11px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        /* ASOSIY O'YIN VA DUEL STYLLARI (O'ZGARTIRILMAGAN) */
        .game-section {
            width: 100%;
            text-align: center;
            margin-top: 10px;
        }

        .btn-duel {
            background: #28a745;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            width: 90%;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(40, 167, 69, 0.3);
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- 1. MINING DASHBOARD (YANGI QO'SHILGAN BO'LIM) -->
        <div class="mining-card">
            <div class="mining-title">⛏️ PASSIVE TOKEN MINING</div>
            <div id="mining-speed" class="mining-speed">⚡️ Speed: 1.00 $QALAMPIR / hr</div>

            <div class="mining-amount">
                <span id="current-mined" class="mining-value">0.00</span>
                <span class="mining-currency"> $QALAMPIR</span>
            </div>

            <button id="claim-btn" class="btn-claim" onclick="claimMining()">
                📥 Claim (Yig'ib olish)
            </button>

            <div class="conversion-box">
                💡 <b>Listing Prognozi:</b> <br>
                <span id="total-points-display" style="color: #ffab00; font-weight: bold;">0</span> Points ≈ 
                <b style="color: #00e676; font-size: 12px;"><span id="estimated-usd">$0.00</span> EST</b>
            </div>
        </div>

        <!-- 2. ASOSIY DUEL VA O'YIN MAYDONI (MAVJUD KODINGIZ O'RGILMAGAN HOLDA SAQLANADI) -->
        <div class="game-section">
            <button class="btn-duel" onclick="startDuelSearch()">⚔️ DUEL SEARCH (O'YIN)</button>
            <div id="game-arena">
                <!-- Duel kartalari va match logikasi bu yerga yuklanadi -->
            </div>
        </div>

    </div>

    <!-- JAVASCRIPT MANTIQLARI -->
    <script>
        // Telegram WebApp interfeysini sozlash
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // URL yoki Telegram SDK orqali User ID olish
        const urlParams = new URLSearchParams(window.location.search);
        const USER_ID = urlParams.get('user_id') || 
                       (window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp.initDataUnsafe?.user?.id : null);

        // MINING UI'NI REALLASHGAN HOLDA YANGILASH
        async function updateMiningUI() {
            if (!USER_ID) return;
            try {
                const res = await fetch(`/api/mining-status/${USER_ID}`);
                const data = await res.json();

                if (data.success) {
                    document.getElementById('current-mined').innerText = data.currentMined;
                    document.getElementById('mining-speed').innerText = `⚡️ Speed: ${parseFloat(data.miningRate).toFixed(2)} $QALAMPIR / hr (+15% Ref)`;
                    
                    const total = (parseFloat(data.totalPoints) + parseFloat(data.currentMined));
                    document.getElementById('total-points-display').innerText = total.toFixed(2);
                    document.getElementById('estimated-usd').innerText = `$${(total * 0.01).toFixed(2)}`;
                }
            } catch (e) {
                console.error("Mining status olishda xatolik:", e);
            }
        }

        // TOKENLARNI CLAIM QILISH
        async function claimMining() {
            if (!USER_ID) return alert("Foydalanuvchi aniqlanmadi!");
            try {
                const res = await fetch('/api/claim-mining', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: USER_ID })
                });
                const data = await res.json();
                alert(data.message);
                updateMiningUI();
            } catch (e) {
                alert("So'rov yuborishda xatolik yuz berdi");
            }
        }

        // MAVJUD DUEL QIDIRUV MANTIQLARI (ESKI KODINGIZ)
        function startDuelSearch() {
            console.log("Duel qidiruvi boshlandi...");
            // Asosiy duel qidiruv funksiyalaringiz bu yerda davom etadi
        }

        // Har 5 soniyada taymerni yangilab turish
        setInterval(updateMiningUI, 5000);
        
        // Sahifa yuklanganda darhol bir marta chaqirish
        document.addEventListener("DOMContentLoaded", updateMiningUI);
    </script>
</body>
                    </html>
